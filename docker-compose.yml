#    env_file: .env
#    environment:
#      - SPRING_PROFILES_ACTIVE=dev
#      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=1.0
#      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
#    networks:
#      - ecommerce-network

  shopping-cart-service:
    image: yamatee/shopping-cart-service:latest
    container_name: shopping-cart-service
    build:
      context: .
      dockerfile: ./be/services/shopping-cart-service/Dockerfile
    env_file: .env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=1.0
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      - postgres
      - redis
    networks:
      - ecommerce-network

