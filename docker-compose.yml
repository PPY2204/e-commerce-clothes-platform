#    env_file: .env
#    environment:
#      - SPRING_PROFILES_ACTIVE=dev
#    depends_on:
#      - postgres
#    networks:
#      - ecommerce-network

  notification-service:
    image: yamatee/notification-service:latest
    container_name: notification-service
    build:
      context: .
      dockerfile: ./be/services/notification-service/Dockerfile
    env_file: .env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_MAIL_HOST=maildev
      - SPRING_MAIL_PORT=1025
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=1.0
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      - kafka
      - maildev
    networks:
      - ecommerce-network

#  review-service:
#    image: yamatee/review-service:latest
#    container_name: review-service
#    build:
#      context: .
#      dockerfile: ./be/services/review-service/Dockerfile
#    env_file: .env
#    environment:
#      - SPRING_PROFILES_ACTIVE=dev
#    depends_on:
#      - mongodb
#    networks:
#      - ecommerce-network

  # --- GATEWAY & FRONTEND ---

  kong:
    image: kong:3.4
    container_name: gateway
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
    volumes:
      - ./infrastructure/kong/kong.yml:/usr/local/kong/declarative/kong.yml
    ports:
      - "8001:8001"
    networks:
      - ecommerce-network
    depends_on:
      - user-service
      - product-catalog-service
      - order-service

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      fe:
        condition: service_healthy
      kong:
        condition: service_started
    networks:
      - ecommerce-network

  fe:
    image: yamatee/frontend:latest
    container_name: frontend
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${GATEWAY_URL}
    environment:
      - NEXT_PUBLIC_API_URL=${GATEWAY_URL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ecommerce-network

  # --- OBSERVABILITY ---
  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: swagger-ui
    ports:
      - "8088:8080"
    environment:
      - SWAGGER_URLS=[{"url":"https://localhost/api/users/api-docs","name":"User Service"},{"url":"https://localhost/api/products/api-docs","name":"Product Catalog"},{"url":"https://localhost/api/orders/api-docs","name":"Order Service"},{"url":"https://localhost/api/cart/api-docs","name":"Shopping Cart"},{"url":"https://localhost/api/payment/api-docs","name":"Payment Service"},{"url":"https://localhost/api/notifications/api-docs","name":"Notification Service"},{"url":"https://localhost/api/reviews/api-docs","name":"Review Service"},{"url":"https://localhost/api/recommendations/api-docs","name":"Recommendation Service"}]
    networks:
      - ecommerce-network

  zipkin:
    image: openzipkin/zipkin:2.24
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - ecommerce-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - ecommerce-network

  maildev:
    image: maildev/maildev
    container_name: maildev
    ports:
      - "1080:1080"
      - "1025:1025"
    networks:
      - ecommerce-network

