server:
  port: 8080

spring:
  application:
    name: notification-service
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ecommerce.common.event"
  mail:
    host: ${SPRING_MAIL_HOST:maildev}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

eureka:
  client:
    enabled: false
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

# Resilience4J Configuration for Notification Service
resilience4j:
  ratelimiter:
    instances:
      email-service:
        limitForPeriod: 500
        limitRefreshPeriod: 1m
        timeoutDuration: 3s
      sms-service:
        limitForPeriod: 100
        limitRefreshPeriod: 1m
        timeoutDuration: 3s

  retry:
    instances:
      email-service:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
      sms-service:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,ratelimiters
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# SMS Provider Configuration
sms:
  provider:
    url: https://api.sms-provider.com
    api-key: ${SMS_API_KEY:test-sms-key-12345}
    limit: 100

