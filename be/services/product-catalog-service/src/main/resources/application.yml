server:
  port: 8080

spring:
  application:
    name: product-catalog-service
  data:
    mongodb:
      uri: ${PRODUCT_DB_URI:mongodb://mongodb:27017/product_db}
      auto-index-creation: true

aws:
  region: us-east-1
  dynamodb:
    endpoint: ${DYNAMODB_ENDPOINT:http://localstack:4566}
  access-key: test
  secret-key: test

eureka:
  client:
    enabled: false
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
